{% extends "admin_2fa/base.html" %}
{% load i18n %}
{% block otp_content %}
<p>{% translate "Enter the 6-digit code from your authenticator app, or one of your backup codes." %}</p>
<form method="post" id="login-form">{% csrf_token %}
  <div class="form-row">
    {{ form.token.errors }}
    <label for="{{ form.token.id_for_label }}">{% translate "Code" %}</label> {{ form.token }}
    <input type="hidden" name="next" value="{{ next }}">
  </div>
  <div class="submit-row"><input type="submit" value="{% translate 'Verify' %}"></div>
</form>
{% endblock %}
