# Rate-limit zones — `http` context.
#
# Installed by the deploy (root, from the committed git blob, like the vhost) as
# /etc/nginx/conf.d/facilitation-limits.conf, BEFORE the vhost: nginx refuses a vhost
# that names an unknown zone (`nginx -t`). A zone cannot be declared inside a
# `server` block, hence this separate file.
#
# `facilitation_admin_login` guards /admin/login/, a plain Django view that the DRF
# throttles do not cover. 10r/m per IP: far above human use, far below what a
# password-guessing run needs (same model as tm-limits.conf / pushit).
limit_req_zone $binary_remote_addr zone=facilitation_admin_login:10m rate=10r/m;

# `facilitation_ws_conn` bounds concurrent WebSockets per IP on /ws/ (audit M7). A room
# holds at most 15 people; 50 leaves room for an office behind one NAT.
limit_conn_zone $binary_remote_addr zone=facilitation_ws_conn:10m;
